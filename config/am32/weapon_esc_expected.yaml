# Expected AM32 2.20 (eeprom_version 3) config for the FREELYRC_F421 weapon ESC.
# Compile with: python3 tools/am32_config_codec.py compile --input <this> --output weapon_esc_expected.hexcfg
# Every field is required.  Notes (see the codec docstring for encodings):
# - motor.bidirectional is AM32 "3D mode": needed for reverse spin on ZL.
# - brake_on_stop false: a spinning drum coasts rather than being braked hard.
# - comp_pwm false: drum freewheels when throttle drops; sine start is then
#   ignored by AM32, so it is off here.
# - protection.current_limit 255 (off): this ESC has no working current sensor
#   (it reports a constant 62 A), so no current limit can be enforced.
# - protection.temperature_limit 70: MCU internal sensor, in C.
eeprom_version: 3
firmware_version:
  major: 2
  minor: 20
motor:
  kv: 27
  poles: 14
  direction_reversed: false
  bidirectional: true
  brake_on_stop: false
  stall_protection: false
startup:
  power: 100
  use_sine_start: false
  sine_mode_power: 5
  sine_changeover_throttle: 5
timing:
  advance_level: 16
  auto_advance: true
  pwm_frequency: 24
  comp_pwm: false
  variable_pwm: true
input:
  type: 1
  servo_low: 255
  servo_high: 255
  servo_neutral: 255
  servo_deadband: 255
  disable_stick_calibration: false
braking:
  active_brake_power: 0
  drag_brake_strength: 10
  driving_brake_strength: 10
  rc_car_reverse: false
protection:
  temperature_limit: 70
  current_limit: 255
  low_voltage_cutoff: 255
  low_cell_volt_cutoff: 255
  abs_voltage_cutoff: 10
  stuck_rotor_protection: false
current_control:
  p_gain: 100
  i_gain: 0
  d_gain: 100
  max_ramp: 160
  min_duty_cycle: 1
misc:
  beep_volume: 11
  telemetry_interval: 1
  use_hall_sensors: false
can:
  node: 255
  esc_index: 255
  require_arming: 255
  telem_rate: 255
  require_zero_throttle: 255
  filter_hz: 255
  debug_rate: 255
  term_enable: 255
